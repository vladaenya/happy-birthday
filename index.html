    <style>
        :root {
            --bg-dark: #121013;
            --bg-card: rgba(255, 248, 240, 0.04);
            --bg-card-hover: rgba(255, 248, 240, 0.08);
            --border-soft: rgba(245, 210, 175, 0.16);
            --accent-warm: #e8b88a;
            --accent-glow: rgba(232, 184, 138, 0.28);
            --text-main: #f4efe6;
            --text-muted: #b5aba0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(232, 184, 138, 0.09) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(168, 126, 110, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            line-height: 1.75;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
        .music-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 50;
            background: rgba(24, 21, 26, 0.85); backdrop-filter: blur(10px);
            border: 1px solid var(--border-soft); color: var(--accent-warm);
            padding: 10px 18px; border-radius: 999px; font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem; letter-spacing: 0.04em; cursor: pointer;
            display: flex; align-items: center; gap: 9px; transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35); max-width: calc(100vw - 40px);
        }
        .music-toggle:hover { border-color: var(--accent-warm); transform: translateY(-2px); }
        .music-toggle.playing { background: rgba(232, 184, 138, 0.14); border-color: var(--accent-warm); box-shadow: 0 0 20px rgba(232, 184, 138, 0.25); }
        .eq-bars { display: inline-flex; align-items: flex-end; height: 12px; gap: 2px; flex-shrink: 0; }
        .eq-bars span { width: 2px; height: 4px; background: var(--accent-warm); border-radius: 2px; transition: height 0.2s ease; }
        .music-toggle.playing .eq-bars span { animation: eqBounce 0.9s ease-in-out infinite alternate; }
        .music-toggle.playing .eq-bars span:nth-child(2) { animation-delay: 0.25s; }
        .music-toggle.playing .eq-bars span:nth-child(3) { animation-delay: 0.5s; }
        @keyframes eqBounce { 0% { height: 3px; } 100% { height: 12px; } }
        .ambient-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; background: var(--accent-warm); border-radius: 50%; opacity: 0; filter: blur(1px); animation: floatUp linear infinite; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.45; }
            80% { opacity: 0.25; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }
        .container { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 80px 24px 95px; }
        header { text-align: center; margin-bottom: 52px; }
        .date-badge {
            display: inline-block; font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--accent-warm); border: 1px solid var(--border-soft); padding: 6px 16px;
            border-radius: 999px; margin-bottom: 22px; background: rgba(232, 184, 138, 0.04);
        }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.4rem, 5vw, 3.6rem); font-weight: 500; line-height: 1.15; margin-bottom: 16px; color: #fffaf2; }
        .subtitle { color: var(--text-muted); font-size: 1rem; max-width: 540px; margin: 0 auto; }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 500; text-align: center; margin-bottom: 10px; color: #fffaf2; }
        .section-hint { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 32px; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; margin-bottom: 56px; }
        .memory-card {
            background: var(--bg-card); border: 1px solid var(--border-soft); border-radius: 20px;
            padding: 26px 22px; cursor: pointer; transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative; overflow: hidden; min-height: 175px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .memory-card:hover { background: var(--bg-card-hover); border-color: rgba(232, 184, 138, 0.4); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25); }
        .card-tag { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent-warm); margin-bottom: 10px; }
        .card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.45rem; font-weight: 600; color: #fffaf2; margin-bottom: 8px; }
        .card-preview { font-size: 0.85rem; color: var(--text-muted); }
